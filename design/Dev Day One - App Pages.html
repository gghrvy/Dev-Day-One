<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Day One — App Pages Redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } body { background: #111; font-family: "Inter", -apple-system, sans-serif; } button, select { font-family: inherit; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="pages/shared.jsx"></script>
  <script type="text/babel" src="pages/app-repos-panels.jsx"></script>
  <script type="text/babel" src="pages/app-intel-panels.jsx"></script>
  <script type="text/babel" src="pages/app-content-panels.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas title="Dev Day One — App Pages (Direction A · Safe Evolution)">

          <DCSection id="repos" title="01 · Repositories" subtitle="Repo list, single-repo overview, and connect-repo onboarding. Unified sidebar replaces the icon-rail + context-panel split.">
            <DCArtboard id="repo-list"     label="Repo List"             width={960} height={680}><RepoListPage /></DCArtboard>
            <DCArtboard id="repo-overview" label="Repo Overview"         width={960} height={680}><RepoOverviewPage /></DCArtboard>
            <DCArtboard id="connect-repo"  label="Connect Repository"    width={960} height={680}><ConnectRepoPage /></DCArtboard>
          </DCSection>

          <DCSection id="intel" title="02 · AI Intelligence" subtitle="Architecture graph, pattern detection, and impact analysis — all using the indigo accent for AI-generated content.">
            <DCArtboard id="architecture" label="Architecture"    width={960} height={680}><ArchitecturePage /></DCArtboard>
            <DCArtboard id="patterns"     label="Patterns"        width={960} height={680}><PatternsPage /></DCArtboard>
            <DCArtboard id="impact"       label="Impact Analysis" width={960} height={680}><ImpactPage /></DCArtboard>
          </DCSection>

          <DCSection id="content" title="03 · Knowledge &amp; Data" subtitle="Knowledge entries, ADRs, and API inventory — list-based pages sharing a consistent row pattern.">
            <DCArtboard id="knowledge" label="Knowledge"     width={960} height={680}><KnowledgePage /></DCArtboard>
            <DCArtboard id="adrs"      label="ADRs"          width={960} height={680}><ADRsPage /></DCArtboard>
            <DCArtboard id="apis"      label="API Inventory" width={960} height={680}><APIsPage /></DCArtboard>
          </DCSection>

          <DCSection id="account" title="04 · Account" subtitle="Settings page — profile, connected accounts, sign-out. Sidebar footer highlights Settings when active.">
            <DCArtboard id="settings" label="Settings" width={960} height={680}><SettingsPage /></DCArtboard>
          </DCSection>

        </DesignCanvas>
      )
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />)
  </script>
</body>
</html>
